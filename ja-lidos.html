<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Aurora — Já Lidos</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    @layer base { html,body { margin:0; padding:0; } body { overscroll-behavior:none; } }
    ::-webkit-scrollbar { display:none; }
    .star-btn { background:none; border:none; cursor:pointer; padding:2px; transition:transform .15s; }
    .star-btn:hover { transform:scale(1.15); }
    .star-btn .material-symbols-outlined { font-size:2rem; color:#f59e0b; }
    .star-btn.empty .material-symbols-outlined { color:#c6c5d0; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00021d",
            "primary-container": "#0f194a",
            "on-primary": "#ffffff",
            "secondary": "#25638f",
            "secondary-container": "#95ccfe",
            "on-secondary-container": "#125783",
            "secondary-fixed": "#cde5ff",
            "on-secondary-fixed": "#001d32",
            "surface": "#fbf9f3",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f3ee",
            "surface-container": "#f0eee8",
            "surface-container-high": "#eae8e2",
            "surface-container-highest": "#e4e2dd",
            "outline": "#767680",
            "on-surface": "#1b1c19",
            "on-surface-variant": "#46464f",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a"
          },
          fontFamily: {
            "body-md": ["Open Sans"],
            "body-sm": ["Open Sans"],
            "headline-lg": ["Montserrat"],
            "headline-md": ["Montserrat"],
            "headline-sm": ["Montserrat"],
            "title-lg": ["Montserrat"],
            "title-md": ["Montserrat"],
            "label-lg": ["Montserrat"],
            "label-md": ["Montserrat"],
            "label-sm": ["Montserrat"]
          },
          spacing: {
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "1rem",
            "space-lg": "1.5rem",
            "space-xl": "2.5rem"
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed">

  <!-- Sidebar Lateral Fixa -->
  <aside class="fixed left-0 top-0 h-screen w-72 bg-surface-container-lowest shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-50 flex flex-col justify-between">
    <div class="flex flex-col">
      <div class="h-20 px-space-lg flex items-center gap-space-sm bg-surface-container-lowest">
        <img alt="Logo Aurora" class="w-10 h-10 object-contain rounded-lg shadow-sm" src="img/logo.svg">
        <div class="flex flex-col">
          <span class="font-title-lg text-title-lg text-primary-container tracking-tight font-bold">Aurora</span>
          <span class="font-label-sm text-label-sm uppercase tracking-wider text-secondary">Aluguel de Livros</span>
        </div>
      </div>

      <div class="px-space-md py-space-sm">
        <nav class="flex flex-col gap-space-xs">
          <!-- Renderizado dinamicamente por AuroraAPI.initSidebar() -->
        </nav>
      </div>
    </div>

    <!-- Perfil do Usuário na Sidebar -->
    <div class="p-space-md flex flex-col gap-space-sm bg-surface-container-lowest">
      <div class="flex items-center gap-space-sm p-space-sm rounded-xl bg-surface-container-low">
        <img alt="Perfil" class="w-8 h-8 rounded-full object-cover ring-2 ring-secondary-fixed user-display-avatar" src="img/avatar-default.svg">
        <div class="flex flex-col min-w-0 flex-1">
          <span class="font-label-lg text-label-lg text-on-surface truncate user-display-name">Carregando...</span>
          <span class="font-label-sm text-label-sm text-secondary truncate user-display-role">Leitor</span>
        </div>
      </div>
      <a class="flex items-center gap-space-sm px-space-md py-space-sm rounded-xl text-on-surface-variant font-label-lg hover:bg-error-container hover:text-on-error-container transition-all group" data-path="login" href="login.html" onclick="AuroraAPI.logout(); return true;">
        <span class="material-symbols-outlined text-outline group-hover:text-error transition-colors" translate="no">logout</span>
        <span>Sair</span>
      </a>
    </div>
  </aside>

  <!-- Conteúdo Principal -->
  <div class="pl-72 flex flex-col min-h-screen">
    <header class="fixed top-0 left-72 right-0 h-20 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-40 flex items-center justify-between px-space-lg">
      <h2 class="font-headline-sm text-headline-sm text-primary-container font-bold">Meus Livros Já Lidos</h2>
      <div class="flex items-center gap-space-md">
        <span class="font-body-sm text-body-sm text-on-surface-variant" id="header-count">0 livros lidos</span>
      </div>
    </header>

    <main class="w-full pt-24 pb-16 bg-surface flex-1">
      <div class="max-w-7xl mx-auto px-space-md lg:px-space-xl">
        
        <!-- Search bar -->
        <div class="w-full mb-space-lg p-space-sm md:p-space-md rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-space-sm border border-surface-container/60">
          <div class="relative flex-1">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline pointer-events-none text-[20px]" translate="no">search</span>
            <input class="w-full h-11 pl-10 pr-4 bg-surface-container-low rounded-xl font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary/40 transition-all" id="search-input" placeholder="Filtrar por título ou autor..." type="text">
          </div>
        </div>

        <!-- Books Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-space-lg" id="books-grid">
          <!-- Populated by JS -->
        </div>

        <!-- Empty state -->
        <div class="hidden flex-col items-center justify-center py-space-2xl text-center" id="empty-state">
          <span class="material-symbols-outlined text-6xl text-outline mb-space-md" translate="no">library_books</span>
          <h3 class="font-headline-sm text-headline-sm text-primary-container mb-2 font-bold">Nenhum livro lido ainda</h3>
          <p class="font-body-md text-body-md text-on-surface-variant mb-space-lg">Marque livros como lidos na Prateleira para acompanhar seu histórico e avaliá-los.</p>
          <a href="prateleira.html" class="h-10 px-space-md rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center gap-2 shadow-sm hover:opacity-90 transition-opacity">
            <span class="material-symbols-outlined text-[18px]" translate="no">shelves</span>
            Ver Prateleira
          </a>
        </div>

        <!-- Loading skeleton -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-space-lg" id="loading-state">
          <div class="animate-pulse bg-surface-container-lowest rounded-2xl p-space-md h-72"></div>
          <div class="animate-pulse bg-surface-container-lowest rounded-2xl p-space-md h-72"></div>
          <div class="animate-pulse bg-surface-container-lowest rounded-2xl p-space-md h-72"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal de Avaliação de Livro -->
  <div class="fixed inset-0 z-50 hidden items-center justify-center bg-primary/40 backdrop-blur-sm p-4" id="review-modal">
    <div class="bg-surface-container-lowest rounded-3xl max-w-lg w-full p-space-lg shadow-2xl flex flex-col gap-space-md border border-surface-container">
      <div class="flex items-start justify-between">
        <div>
          <span class="font-label-sm text-xs uppercase tracking-wider text-secondary font-bold">Avaliação do Leitor</span>
          <h3 class="font-headline-sm text-xl text-primary font-bold mt-1" id="review-modal-title">Título do Livro</h3>
          <p class="font-body-sm text-xs text-on-surface-variant" id="review-modal-author">Autor</p>
        </div>
        <button onclick="closeReviewModal()" class="w-8 h-8 rounded-full bg-surface-container hover:bg-surface-container-high flex items-center justify-center text-on-surface transition-colors">
          <span class="material-symbols-outlined text-[18px]" translate="no">close</span>
        </button>
      </div>

      <!-- Estrelas Interativas -->
      <div>
        <label class="font-label-sm text-xs text-outline uppercase font-semibold block mb-2">Sua nota (1 a 5 estrelas)</label>
        <div class="flex items-center gap-1" id="review-stars">
          <button class="star-btn empty" onclick="setReviewStar(1)" title="1 estrela" type="button"><span class="material-symbols-outlined" translate="no">star</span></button>
          <button class="star-btn empty" onclick="setReviewStar(2)" title="2 estrelas" type="button"><span class="material-symbols-outlined" translate="no">star</span></button>
          <button class="star-btn empty" onclick="setReviewStar(3)" title="3 estrelas" type="button"><span class="material-symbols-outlined" translate="no">star</span></button>
          <button class="star-btn empty" onclick="setReviewStar(4)" title="4 estrelas" type="button"><span class="material-symbols-outlined" translate="no">star</span></button>
          <button class="star-btn empty" onclick="setReviewStar(5)" title="5 estrelas" type="button"><span class="material-symbols-outlined" translate="no">star</span></button>
          <span class="ml-3 font-title-md text-sm text-primary font-bold" id="review-star-label">—</span>
        </div>
      </div>

      <!-- Comentário -->
      <div>
        <label for="review-comentario" class="font-label-sm text-xs text-outline uppercase font-semibold block mb-2">Seu Comentário ou Resenha</label>
        <textarea id="review-comentario" rows="3" class="w-full p-3 bg-surface-container-low rounded-xl text-on-surface font-body-sm text-xs placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary/40 border border-surface-container resize-none" placeholder="O que você achou desta leitura? Destaque pontos marcantes..."></textarea>
      </div>

      <div id="review-modal-error" class="hidden rounded-xl bg-error-container text-on-error-container p-3 font-body-sm text-xs"></div>

      <div class="flex items-center justify-end gap-space-xs pt-space-xs border-t border-surface-container">
        <button onclick="closeReviewModal()" class="px-4 py-2 rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-md text-xs font-bold transition-colors">Cancelar</button>
        <button onclick="submitReview()" id="review-submit-btn" class="px-4 py-2 rounded-xl bg-primary-container text-on-primary hover:bg-primary font-label-md text-xs font-bold flex items-center gap-1.5 shadow-sm transition-colors">
          <span class="material-symbols-outlined text-[16px]" translate="no">star</span>
          Salvar Avaliação
        </button>
      </div>
    </div>
  </div>

  <script src="js/aurora-api.js"></script>
  <script>
    if (!AuroraAPI.isAuthenticated()) {
      window.location.href = 'login.html';
    }

    let allBooks = [];
    let reviewBookId = null;
    let reviewStar = 0;

    document.addEventListener('DOMContentLoaded', async () => {
      await AuroraAPI.initSidebar('ja-lidos');
      await loadReadBooks();

      document.getElementById('search-input').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        const filtered = allBooks.filter(b => 
          (b.titulo || '').toLowerCase().includes(q) || 
          (b.autor || '').toLowerCase().includes(q)
        );
        renderBooks(filtered);
      });
    });

    async function loadReadBooks() {
      document.getElementById('loading-state').style.display = 'grid';
      document.getElementById('books-grid').innerHTML = '';
      document.getElementById('empty-state').classList.add('hidden');

      try {
        allBooks = await AuroraAPI.getReadBooks();
        document.getElementById('header-count').textContent = `${allBooks.length} livro${allBooks.length !== 1 ? 's' : ''} lido${allBooks.length !== 1 ? 's' : ''}`;
        renderBooks(allBooks);
      } catch (e) {
        AuroraAPI.showToast('Erro ao carregar lista de já lidos.', 'error', true);
      } finally {
        document.getElementById('loading-state').style.display = 'none';
      }
    }

    function renderBooks(books) {
      const grid = document.getElementById('books-grid');
      grid.innerHTML = '';

      if (!books || books.length === 0) {
        const emptyEl = document.getElementById('empty-state');
        emptyEl.classList.remove('hidden');
        emptyEl.classList.add('flex');
        return;
      }

      books.forEach(book => {
        const card = buildCard(book);
        grid.appendChild(card);
      });
    }

    function buildCard(book) {
      const article = document.createElement('article');
      article.className = 'group bg-surface-container-lowest rounded-2xl p-space-md shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between hover:-translate-y-1 border border-surface-container/60';

      const availableCopies = typeof book.copiasDisponiveis === 'number' ? book.copiasDisponiveis : 0;
      const coverUrl = book.capaUrl || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80';
      const tamanho = book.faixaTamanho ? book.faixaTamanho.replace('_', ' ') : '';
      const paginas = book.numPaginas ? `${book.numPaginas} págs` : '';
      const sizeLabel = [tamanho, paginas].filter(Boolean).join(' • ');

      article.innerHTML = `
        <div>
          <div class="relative w-full aspect-[16/10] bg-surface-container-low rounded-xl overflow-hidden mb-space-sm flex items-center justify-center p-4">
            <img class="w-28 h-40 rounded-lg object-cover shadow-xl transition-transform duration-300 group-hover:scale-105" src="${coverUrl}" alt="Capa de ${escHtml(book.titulo)}">
            <div class="absolute top-3 left-3">
              <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container-lowest/90 backdrop-blur-md font-label-sm text-xs text-secondary-container shadow-xs font-semibold">
                <span class="material-symbols-outlined text-[14px] text-secondary" translate="no">verified</span>
                Leitura Concluída
              </span>
            </div>
            ${sizeLabel ? `<div class="absolute bottom-3 right-3"><span class="px-2 py-0.5 rounded-md bg-primary-container/85 text-on-primary font-label-sm text-[10px] uppercase font-bold backdrop-blur-sm">${escHtml(sizeLabel)}</span></div>` : ''}
          </div>
          <div class="flex items-center justify-between text-on-surface-variant font-label-sm text-xs mb-1">
            <span class="text-secondary font-semibold">${escHtml(book.genero || 'Geral')}</span>
          </div>
          <h2 class="font-title-lg text-title-md text-primary font-bold group-hover:text-secondary transition-colors line-clamp-1">${escHtml(book.titulo)}</h2>
          <p class="font-body-sm text-xs text-on-surface-variant mb-space-sm truncate">${escHtml(book.autor)}</p>
        </div>
        <div class="grid grid-cols-2 gap-space-xs pt-space-xs border-t border-surface-container">
          <button onclick="unmarkRead(${book.id}, this)" class="h-10 px-2 rounded-xl bg-surface-container text-on-surface hover:bg-error-container hover:text-on-error-container font-label-md text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors">
            <span class="material-symbols-outlined text-[16px]" translate="no">bookmark_remove</span>
            Remover
          </button>
          ${availableCopies > 0 ? `
            <button onclick="rentAgain(${book.id}, '${escHtml(book.titulo).replace(/'/g, "\\'")}', this)" 
              class="h-10 px-2 rounded-xl bg-primary-container text-on-primary hover:bg-primary transition-colors font-label-md text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
              <span class="material-symbols-outlined text-[16px] text-secondary-fixed" translate="no">autorenew</span>
              Alugar Novamente
            </button>
          ` : `
            <button onclick="openReviewModal(${book.id}, '${escHtml(book.titulo).replace(/'/g, "\\'")}', '${escHtml(book.autor).replace(/'/g, "\\'")}')" 
              class="h-10 px-2 rounded-xl bg-secondary-fixed text-on-secondary-fixed hover:bg-secondary-container transition-colors font-label-md text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
              <span class="material-symbols-outlined text-[16px]" translate="no">rate_review</span>
              Avaliar Livro
            </button>
          `}
        </div>
      `;
      return article;
    }

    async function unmarkRead(bookId, btn) {
      btn.disabled = true;
      btn.textContent = 'Removendo...';
      try {
        await AuroraAPI.unmarkAsRead(bookId);
        AuroraAPI.showToast('Livro removido dos Já Lidos.', 'bookmark_remove');
        await loadReadBooks();
        await AuroraAPI.initSidebar('ja-lidos');
      } catch (e) {
        AuroraAPI.showToast('Erro ao desmarcar livro.', 'error', true);
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-[16px]" translate="no">bookmark_remove</span> Remover';
      }
    }

    async function rentAgain(bookId, title, btn) {
      btn.disabled = true;
      try {
        await AuroraAPI.rentBook(bookId);
        AuroraAPI.showToast(`"${title}" alugado novamente com sucesso!`, 'check_circle');
        await loadReadBooks();
        await AuroraAPI.initSidebar('ja-lidos');
      } catch (e) {
        AuroraAPI.showToast(e.message || 'Erro ao alugar livro.', 'error', true);
        btn.disabled = false;
      }
    }

    // Modal de Avaliação
    function openReviewModal(bookId, title, author) {
      reviewBookId = bookId;
      reviewStar = 5;
      document.getElementById('review-modal-title').textContent = title;
      document.getElementById('review-modal-author').textContent = author;
      document.getElementById('review-comentario').value = '';
      document.getElementById('review-modal-error').classList.add('hidden');
      setReviewStar(5);

      const modal = document.getElementById('review-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeReviewModal() {
      const modal = document.getElementById('review-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      reviewBookId = null;
    }

    function setReviewStar(val) {
      reviewStar = val;
      const labels = ['', '1 – Ruim', '2 – Regular', '3 – Bom', '4 – Muito Bom', '5 – Excelente!'];
      document.getElementById('review-star-label').textContent = labels[val] || '—';
      document.querySelectorAll('#review-stars .star-btn').forEach((btn, i) => {
        btn.classList.toggle('empty', i >= val);
      });
    }

    async function submitReview() {
      if (!reviewBookId || !reviewStar) {
        const err = document.getElementById('review-modal-error');
        err.textContent = 'Selecione uma nota de 1 a 5 estrelas.';
        err.classList.remove('hidden');
        return;
      }

      const comentario = document.getElementById('review-comentario').value.trim();
      const btn = document.getElementById('review-submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined text-[16px] animate-spin" translate="no">refresh</span> Salvando...';

      try {
        await AuroraAPI.rateBook(reviewBookId, reviewStar, comentario);
        AuroraAPI.showToast('Avaliação salva com sucesso!', 'star');
        closeReviewModal();
      } catch (err) {
        const errorEl = document.getElementById('review-modal-error');
        errorEl.textContent = err.message || 'Erro ao registrar avaliação.';
        errorEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-[16px]" translate="no">star</span> Salvar Avaliação';
      }
    }

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
  </script>
</body>
</html>
