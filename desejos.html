<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Aurora — Lista de Desejos</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    @layer base { html,body { margin:0; padding:0; } body { overscroll-behavior:none; } }
    ::-webkit-scrollbar { display:none; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00021d",
            "primary-container": "#0f194a",
            "on-primary": "#ffffff",
            "secondary": "#25638f",
            "secondary-container": "#95ccfe",
            "on-secondary-container": "#125783",
            "secondary-fixed": "#cde5ff",
            "on-secondary-fixed": "#001d32",
            "surface": "#fbf9f3",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f3ee",
            "surface-container": "#f0eee8",
            "surface-container-high": "#eae8e2",
            "surface-container-highest": "#e4e2dd",
            "outline": "#767680",
            "on-surface": "#1b1c19",
            "on-surface-variant": "#46464f",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a"
          },
          fontFamily: {
            "body-md": ["Open Sans"],
            "body-sm": ["Open Sans"],
            "headline-lg": ["Montserrat"],
            "headline-md": ["Montserrat"],
            "headline-sm": ["Montserrat"],
            "title-lg": ["Montserrat"],
            "title-md": ["Montserrat"],
            "label-lg": ["Montserrat"],
            "label-md": ["Montserrat"],
            "label-sm": ["Montserrat"]
          },
          spacing: {
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "1rem",
            "space-lg": "1.5rem",
            "space-xl": "2.5rem"
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed">

  <!-- Sidebar Lateral Fixa -->
  <aside class="fixed left-0 top-0 h-screen w-72 bg-surface-container-lowest shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-50 flex flex-col justify-between">
    <div class="flex flex-col">
      <div class="h-20 px-space-lg flex items-center gap-space-sm bg-surface-container-lowest">
        <img alt="Logo Aurora" class="w-10 h-10 object-contain rounded-lg shadow-sm" src="img/logo.svg">
        <div class="flex flex-col">
          <span class="font-title-lg text-title-lg text-primary-container tracking-tight font-bold">Aurora</span>
          <span class="font-label-sm text-label-sm uppercase tracking-wider text-secondary">Aluguel de Livros</span>
        </div>
      </div>

      <div class="px-space-md py-space-sm">
        <nav class="flex flex-col gap-space-xs">
          <!-- Renderizado dinamicamente por AuroraAPI.initSidebar() -->
        </nav>
      </div>
    </div>

    <!-- Perfil do Usuário na Sidebar -->
    <div class="p-space-md flex flex-col gap-space-sm bg-surface-container-lowest">
      <div class="flex items-center gap-space-sm p-space-sm rounded-xl bg-surface-container-low">
        <img alt="Perfil" class="w-8 h-8 rounded-full object-cover ring-2 ring-secondary-fixed user-display-avatar" src="img/avatar-default.svg">
        <div class="flex flex-col min-w-0 flex-1">
          <span class="font-label-lg text-label-lg text-on-surface truncate user-display-name">Carregando...</span>
          <span class="font-label-sm text-label-sm text-secondary truncate user-display-role">Leitor</span>
        </div>
      </div>
      <a class="flex items-center gap-space-sm px-space-md py-space-sm rounded-xl text-on-surface-variant font-label-lg hover:bg-error-container hover:text-on-error-container transition-all group" data-path="login" href="login.html" onclick="AuroraAPI.logout(); return true;">
        <span class="material-symbols-outlined text-outline group-hover:text-error transition-colors" translate="no">logout</span>
        <span>Sair</span>
      </a>
    </div>
  </aside>

  <!-- Área Principal -->
  <div class="pl-72 flex flex-col min-h-screen">
    <header class="fixed top-0 left-72 right-0 h-20 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-40 flex items-center justify-between px-space-lg">
      <h2 class="font-headline-sm text-headline-sm text-primary-container font-bold">Minha Lista de Desejos</h2>
      <span class="font-body-sm text-xs text-on-surface-variant" id="header-count">0 livros na lista</span>
    </header>

    <main class="w-full pt-24 pb-16 bg-surface flex-1">
      <div class="max-w-7xl mx-auto px-space-md lg:px-space-xl">

        <!-- Search Bar -->
        <div class="w-full mb-space-lg p-space-sm md:p-space-md rounded-2xl bg-surface-container-lowest shadow-sm flex items-center gap-space-sm border border-surface-container/60">
          <div class="relative flex-1">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline pointer-events-none text-[20px]" translate="no">search</span>
            <input class="w-full h-11 pl-10 pr-4 bg-surface-container-low rounded-xl font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary/40 transition-all" id="search-input" placeholder="Filtrar por título ou autor..." type="text">
          </div>
        </div>

        <!-- Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-space-lg" id="books-grid"></div>

        <!-- Empty State -->
        <div class="hidden flex-col items-center justify-center py-space-2xl text-center p-space-lg rounded-2xl bg-surface-container-lowest border border-surface-container/60" id="empty-state">
          <span class="material-symbols-outlined text-6xl text-outline mb-space-md" translate="no">bookmark_heart</span>
          <h3 class="font-headline-sm text-headline-sm text-primary-container mb-2 font-bold">Sua lista de desejos está vazia</h3>
          <p class="font-body-md text-body-md text-on-surface-variant mb-space-lg">Adicione livros à lista de desejos na Prateleira para monitorar a disponibilidade de cópias.</p>
          <a href="prateleira.html" class="h-10 px-space-md rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center gap-2 shadow-sm hover:opacity-90 transition-opacity">
            <span class="material-symbols-outlined text-[18px]" translate="no">shelves</span>
            Ver Prateleira
          </a>
        </div>

        <!-- Loading Skeleton -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-space-lg" id="loading-state">
          <div class="animate-pulse bg-surface-container-lowest rounded-2xl p-space-md h-72 border border-surface-container/60"></div>
          <div class="animate-pulse bg-surface-container-lowest rounded-2xl p-space-md h-72 border border-surface-container/60"></div>
          <div class="animate-pulse bg-surface-container-lowest rounded-2xl p-space-md h-72 border border-surface-container/60"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/aurora-api.js"></script>
  <script>
    if (!AuroraAPI.isAuthenticated()) {
      window.location.href = 'login.html';
    }

    let allBooks = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await AuroraAPI.initSidebar('lista-de-desejos');
      await loadWishlist();

      document.getElementById('search-input').addEventListener('input', function() {
        const q = this.value.toLowerCase().trim();
        const filtered = allBooks.filter(b => 
          (b.titulo || '').toLowerCase().includes(q) || 
          (b.autor || '').toLowerCase().includes(q)
        );
        renderBooks(filtered);
      });
    });

    async function loadWishlist() {
      document.getElementById('loading-state').style.display = 'grid';
      document.getElementById('books-grid').innerHTML = '';
      document.getElementById('empty-state').classList.add('hidden');

      try {
        allBooks = await AuroraAPI.getWishlist();
        document.getElementById('header-count').textContent = `${allBooks.length} livro${allBooks.length !== 1 ? 's' : ''} na lista`;
        renderBooks(allBooks);
      } catch (e) {
        AuroraAPI.showToast('Erro ao carregar lista de desejos.', 'error', true);
      } finally {
        document.getElementById('loading-state').style.display = 'none';
      }
    }

    function renderBooks(books) {
      const grid = document.getElementById('books-grid');
      grid.innerHTML = '';

      if (!books || books.length === 0) {
        const el = document.getElementById('empty-state');
        el.classList.remove('hidden');
        el.classList.add('flex');
        return;
      }

      books.forEach(book => grid.appendChild(buildCard(book)));
    }

    function buildCard(book) {
      const copies = typeof book.copiasDisponiveis === 'number' ? book.copiasDisponiveis : 0;
      const available = copies > 0;
      const coverUrl = book.capaUrl || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80';
      const bId = book.bookId || book.id;

      const article = document.createElement('article');
      article.className = 'group bg-surface-container-lowest rounded-2xl p-space-md shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between hover:-translate-y-1 border border-surface-container/60';
      article.innerHTML = `
        <div>
          <div class="relative w-full aspect-[16/10] bg-surface-container-low rounded-xl overflow-hidden mb-space-sm flex items-center justify-center p-4">
            <img class="w-28 h-40 rounded-lg object-cover shadow-xl transition-transform duration-300 group-hover:scale-105" src="${escHtml(coverUrl)}" alt="Capa de ${escHtml(book.titulo)}">
            <div class="absolute top-3 left-3">
              <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full ${available ? 'bg-secondary-fixed text-on-secondary-fixed' : 'bg-surface-container text-outline'} font-label-sm text-xs font-bold shadow-xs">
                <span class="material-symbols-outlined text-[14px]" translate="no">${available ? 'check_circle' : 'schedule'}</span>
                ${available ? `${copies} cópia${copies !== 1 ? 's' : ''} disponível` : 'Indisponível'}
              </span>
            </div>
          </div>
          <div class="flex items-center justify-between text-on-surface-variant font-label-sm text-xs mb-1">
            <span class="text-secondary font-semibold">${escHtml(book.genero || 'Geral')}</span>
            ${book.avaliacaoMedia ? `<span class="text-amber-500 font-bold">★ ${Number(book.avaliacaoMedia).toFixed(1)}</span>` : ''}
          </div>
          <h2 class="font-title-lg text-title-md text-primary font-bold group-hover:text-secondary transition-colors line-clamp-1">${escHtml(book.titulo)}</h2>
          <p class="font-body-sm text-xs text-on-surface-variant mb-space-sm truncate">${escHtml(book.autor)}</p>
        </div>
        <div class="grid grid-cols-2 gap-space-xs pt-space-xs border-t border-surface-container">
          <button onclick="removeWish(${bId}, this)" class="h-10 px-2 rounded-xl bg-surface-container text-on-surface hover:bg-error-container hover:text-on-error-container font-label-md text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors">
            <span class="material-symbols-outlined text-[16px]" translate="no">bookmark_remove</span>
            Remover
          </button>
          ${available ? `
            <button onclick="rentBook(${bId}, '${escHtml(book.titulo).replace(/'/g, "\\'")}', this)"
              class="h-10 px-2 rounded-xl bg-primary-container text-on-primary hover:bg-primary transition-colors font-label-md text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
              <span class="material-symbols-outlined text-[16px] text-secondary-fixed" translate="no">shopping_bag</span>
              Alugar
            </button>
          ` : `
            <button onclick="handleUnavailable(${bId})"
              class="h-10 px-2 rounded-xl bg-secondary-fixed text-on-secondary-fixed hover:bg-secondary-container transition-colors font-label-md text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
              <span class="material-symbols-outlined text-[16px]" translate="no">group</span>
              Fila de Espera
            </button>
          `}
        </div>
      `;
      return article;
    }

    async function removeWish(bookId, btn) {
      btn.disabled = true;
      btn.textContent = 'Removendo...';
      try {
        await AuroraAPI.removeFromWishlist(bookId);
        AuroraAPI.showToast('Removido da lista de desejos.', 'bookmark_remove');
        await loadWishlist();
        await AuroraAPI.initSidebar('lista-de-desejos');
      } catch (e) {
        AuroraAPI.showToast(e.message || 'Erro ao remover.', 'error', true);
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-[16px]" translate="no">bookmark_remove</span> Remover';
      }
    }

    async function rentBook(bookId, title, btn) {
      btn.disabled = true;
      try {
        await AuroraAPI.rentBook(bookId);
        AuroraAPI.showToast(`"${title}" alugado com sucesso!`, 'check_circle');
        await loadWishlist();
        await AuroraAPI.initSidebar('lista-de-desejos');
      } catch (e) {
        AuroraAPI.showToast(e.message || 'Erro ao alugar.', 'error', true);
        btn.disabled = false;
      }
    }

    async function handleUnavailable(bookId) {
      try {
        const queueInfo = await AuroraAPI.getBookQueue(bookId);
        if (queueInfo && queueInfo.total >= 10) {
          window.location.href = `pendente.html?livroId=${bookId}`;
        } else {
          window.location.href = `fila.html?livroId=${bookId}`;
        }
      } catch (e) {
        window.location.href = `fila.html?livroId=${bookId}`;
      }
    }

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
  </script>
</body>
</html>
